name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruby:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
      - run: bundle exec rspec
      - run: NR_API_KEY=test bundle exec fluentd --dry-run -c config/fluentd.conf
      - run: bundle exec fluentd --dry-run -c config/fluentd.compose.conf

  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - run: docker build --target test .
      - run: docker compose up --build --abort-on-container-exit --exit-code-from verify
      - if: always()
        run: docker compose down --volumes

<source>
  @type forward
  @id forward_in
  bind 127.0.0.1
  port 24224
</source>

<match heroku.runtime_metrics>
  @type newrelic
  license_key "#{ENV.fetch('NR_API_KEY')}"
  base_uri https://log-api.newrelic.com/log/v1

  <buffer>
    flush_mode immediate
    retry_type periodic
    retry_wait 2s
    retry_max_times 5
  </buffer>
</match>

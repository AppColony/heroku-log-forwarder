<source>
  @type forward
  @id compose_forward_in
  bind 0.0.0.0
  port 24224
</source>

<match fluentbit.connectivity>
  @type file
  path /tmp/fluentd/fluentbit-events
  append true

  <buffer time>
    timekey 1s
    timekey_wait 0s
    flush_mode interval
    flush_interval 1s
  </buffer>
</match>

<match heroku.runtime_metrics>
  @type file
  path /tmp/fluentd/runtime-metrics-events
  append true

  <buffer>
    flush_mode interval
    flush_interval 1s
  </buffer>
</match>